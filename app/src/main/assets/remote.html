<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>Remote Keyboard</title>
<style>
  :root { color-scheme: dark; --bg:#101418; --card:#1a2027; --fg:#e8edf2; --mute:#8d99a6; --ok:#35c46a; --warn:#f0b429; --bad:#ef5350; --acc:#5aa9ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); gap: 10px; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--card); border-radius: 14px; }
  #dot { width: 14px; height: 14px; border-radius: 50%; background: var(--warn); flex: none; }
  #dot.ok { background: var(--ok); } #dot.bad { background: var(--bad); }
  header b { display: block; } header small { color: var(--mute); }
  #ta { flex: 1; min-height: 120px; width: 100%; resize: none; border: 2px solid transparent; outline: none; border-radius: 14px;
        background: var(--card); color: var(--fg); font: 22px/1.4 system-ui, sans-serif; padding: 14px; }
  #ta:focus { border-color: var(--acc); }
  #ta:disabled { opacity: .5; }
  #keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  #keys button { height: 48px; border: 0; border-radius: 12px; background: var(--card); color: var(--fg); font: 600 17px system-ui, sans-serif; touch-action: manipulation; user-select: none; }
  #keys button:active { background: #2a3440; }
  #keys .wide { grid-column: span 2; background: var(--acc); color: #06223f; }
  p.hint { margin: 0; color: var(--mute); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <div><b id="state">Connecting…</b><small id="sub">Pairing with the board</small></div>
</header>

<textarea id="ta" rows="4" placeholder="Type here with your phone keyboard"
  enterkeyhint="send" autocomplete="off" autocapitalize="sentences" spellcheck="true" disabled></textarea>

<div id="keys">
  <button data-k="tab">Tab</button>
  <button data-k="left" data-rep>&larr;</button>
  <button data-k="up" data-rep>&uarr;</button>
  <button data-k="down" data-rep>&darr;</button>
  <button data-k="right" data-rep>&rarr;</button>
  <button data-k="del" data-rep>&#9003;</button>
  <button data-k="enter" class="wide">Enter &#8629;</button>
  <button data-k="home">Home</button>
  <button data-k="end">End</button>
  <button id="reset">Clear</button>
</div>
<p class="hint">Whatever you type goes to the text box that is focused on the board.</p>

<script>
(function () {
  'use strict';
  var SENT = '​';           // invisible anchor so Backspace on an empty box still reaches the board
  var token = new URLSearchParams(location.search).get('t') || '';
  var ta = document.getElementById('ta');
  var dot = document.getElementById('dot'), stateEl = document.getElementById('state'), subEl = document.getElementById('sub');
  var ws = null, prev = SENT, composing = false, boardFocus = true, failures = 0, hb = null, retryTimer = null;

  function ui(kind, title, sub) { dot.className = kind; stateEl.textContent = title; subEl.textContent = sub || ''; }
  function isOpen() { return ws && ws.readyState === 1; }
  function send(s) { if (isOpen()) { ws.send(s); return true; } return false; }

  function paintConnected() {
    if (boardFocus) ui('ok', 'Connected', 'Typing goes to the board');
    else ui('', 'Connected', 'Tap a text box on the board first');
  }

  function connect() {
    clearTimeout(retryTimer);
    try {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?t=' + encodeURIComponent(token));
    } catch (e) { return scheduleRetry(); }
    ws.onopen = function () {
      failures = 0; resetBuffer(); ta.disabled = false; paintConnected();
      clearInterval(hb); hb = setInterval(function () { send('p'); }, 15000);
      ta.focus();
    };
    ws.onmessage = function (ev) {
      if (ev.data === 'f:1') { boardFocus = true; paintConnected(); }
      else if (ev.data === 'f:0') { boardFocus = false; paintConnected(); }
    };
    ws.onclose = function () {
      clearInterval(hb); ta.disabled = true; failures++;
      if (failures > 4) ui('bad', 'Not paired', 'Scan the QR code on the board again');
      else ui('', 'Reconnecting…', 'Is the board on the same Wi-Fi?');
      scheduleRetry();
    };
  }
  function scheduleRetry() { clearTimeout(retryTimer); retryTimer = setTimeout(connect, Math.min(1000 * (failures + 1), 5000)); }

  function resetBuffer() { prev = SENT; ta.value = SENT; moveCaretToEnd(); }
  function moveCaretToEnd() { var n = ta.value.length; try { ta.setSelectionRange(n, n); } catch (e) {} }

  // Send the difference between what the board already has and what the box holds now.
  // The board is append-only from our point of view: delete the changed tail, retype it.
  function applyValue(cur) {
    var p = 0, m = Math.min(prev.length, cur.length);
    while (p < m && prev.charCodeAt(p) === cur.charCodeAt(p)) p++;
    if (p > 0) { var c = cur.charCodeAt(p - 1); if (c >= 0xD800 && c <= 0xDBFF) p--; } // don't split surrogate pairs
    var del = prev.length - p, ins = cur.slice(p);
    if (del || ins) send('e:' + del + ':' + ins);
    prev = cur;
  }

  function pressEnter() { send('k:enter'); resetBuffer(); }

  ta.addEventListener('input', function () {
    var cur = ta.value;
    if (cur.length === 0) { send('e:1:'); resetBuffer(); return; }   // Backspace on an empty box
    if (cur.charAt(0) !== SENT) { cur = SENT + cur; ta.value = cur; moveCaretToEnd(); }
    var nl = cur.indexOf('\n');
    if (nl >= 0) { applyValue(cur.slice(0, nl)); pressEnter(); return; }
    applyValue(cur);
    if (cur.length > 3000 && !composing) resetBuffer();
  });
  ta.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); pressEnter(); } });
  ta.addEventListener('beforeinput', function (e) { if (e.inputType === 'insertLineBreak') { e.preventDefault(); pressEnter(); } });
  ta.addEventListener('compositionstart', function () { composing = true; });
  ta.addEventListener('compositionend', function () { composing = false; });
  document.addEventListener('selectionchange', function () {
    if (document.activeElement === ta && !composing && ta.selectionStart !== ta.value.length) moveCaretToEnd();
  });

  // Special keys. pointerdown + preventDefault keeps the phone keyboard open.
  var holdTimer = null, repTimer = null;
  function stopRepeat() { clearTimeout(holdTimer); clearInterval(repTimer); }
  Array.prototype.forEach.call(document.querySelectorAll('#keys button[data-k]'), function (b) {
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      var k = b.getAttribute('data-k');
      send('k:' + k);
      if (k === 'enter') resetBuffer();
      if (b.hasAttribute('data-rep')) {
        stopRepeat();
        holdTimer = setTimeout(function () { repTimer = setInterval(function () { send('k:' + k); }, 70); }, 400);
      }
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { b.addEventListener(n, stopRepeat); });
  });
  document.getElementById('reset').addEventListener('pointerdown', function (e) { e.preventDefault(); resetBuffer(); });

  if (!token) { ui('bad', 'No pairing code', 'Scan the QR code on the board with your camera'); }
  else connect();
})();
</script>
</body>
</html>
