plugins {
    id 'com.android.application'
}

android {
    namespace 'app.p2keyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'app.p2keyboard'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideload-friendly: sign release with the debug key unless you set up your own.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/BCKEY.*', 'META-INF/BC*.SF']
        }
    }
}

// Optional: point Robolectric at pre-downloaded android-all jars (offline / rate-limited machines).
tasks.withType(Test).configureEach {
    def dir = System.getenv('ROBOLECTRIC_DEPS_DIR')
    if (dir) {
        systemProperty 'robolectric.offline', 'true'
        systemProperty 'robolectric.dependency.dir', dir
    }
    def png = System.getenv('KEYBOARD_PNG') // optional: KeyboardRelayTest renders the keyboard here
    if (png) systemProperty 'keyboardPng', png
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.13'
}
